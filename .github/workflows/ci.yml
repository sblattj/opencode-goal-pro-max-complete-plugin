name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Bun unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14" # pinned: dist/ is bundled with this version; "latest" drifts and fails the freshness check
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run syntax and unit tests
        run: bun run check

  node-installer:
    name: Node installer (npx path)
    # Node 18 is the package.json "engines" floor. The installer is what users
    # run through npx, so it and the packed-package contracts stay on Node.
    # Bun is only here for the dependency install and the bundle-freshness check.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js 18
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "18"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14" # pinned: dist/ is bundled with this version; "latest" drifts and fails the freshness check
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run installer tests under Node
        run: node --test test/installer-cli.test.js test/bootstrap-dispatch.test.js
      - name: Compile installed-package type contracts
        run: bun run type:check
      - name: Verify installed tarball host contract
        run: bun run smoke:packed-host
      - name: Verify installed tarball tool contract
        run: bun run smoke:packed-tools
      - name: Verify both plugin targets in the packed manifest
        run: bun run smoke:packed-manifest
      - name: Verify the package stays installable from a git spec
        run: bun run smoke:git-install
      - name: Verify package contents
        run: bun run pack:check

  quality-contracts:
    name: Quality contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14" # pinned: dist/ is bundled with this version; "latest" drifts and fails the freshness check
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Verify dist/ is the frozen-install bundle of src/
        run: |
          bun run bundle
          git diff --exit-code -- dist
      - name: Run tests with coverage
        run: bun run test:coverage
      - name: Prove critical tests kill safety regressions
        run: bun run test:mutation
      - name: Run behavior and efficiency benchmark
        run: bun run benchmark:behavior
      - name: Run source package smoke test
        run: bun run smoke
      - name: Audit production dependencies
        run: bun audit --prod --audit-level=high

  filesystem-compatibility:
    name: Filesystem (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14" # pinned: dist/ is bundled with this version; "latest" drifts and fails the freshness check
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run portable lifecycle and filesystem tests
        run: bun test ./test/host-lifecycle.test.js ./test/persistence-lease.test.js ./test/public-hook-cancellation.test.js ./test/session-concurrency.test.js
      - name: Compile installed-package type contracts on Windows
        if: runner.os == 'Windows'
        run: bun run type:check
      - name: Verify installed tarball host contract on Windows
        if: runner.os == 'Windows'
        run: bun run smoke:packed-host
      - name: Verify installed tarball tool contract on Windows
        if: runner.os == 'Windows'
        run: bun run smoke:packed-tools
